<div class="application-list-container">
  <!-- Header -->
  <div class="application-header">
    <span>Club</span>
    <span>Date</span>
    <span>Status</span>
    <span></span>
  </div>

  <!-- List Content -->
  <div class="application-list-content">
    @for (app of applications(); track app.id) {
    <app-application-item [application]="app" (viewDetails)="onViewDetails($event)" />
    } @empty {
    <div class="empty-state">
      <p>You have not submitted any membership applications yet.</p>
    </div>
    }
  </div>
</div>

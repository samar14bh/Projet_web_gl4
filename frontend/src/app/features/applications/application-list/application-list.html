<div class="application-list-container">
  <!-- Header -->
  <div class="application-header">
    <span>Club</span>
    <span>Date</span>
    <span>Status</span>
    <span></span>
  </div>

  <!-- List Content -->
  <div class="application-list-content">
    @if (applications().length > 0) {
      <app-application-item
        *ngFor="let app of applications(); trackBy: trackById"
        [application]="app"
        (viewDetails)="onViewDetails($event)"
      />
    } @else {
      <div class="empty-state">
        <p>You have not submitted any membership applications yet.</p>
      </div>
    }
  </div>
</div>

<div class="verify-error-container">
  <div class="verify-error-card">
    <!-- Icône d'erreur -->
    <div class="error-icon-container">
      <div class="error-icon">
        <svg class="error-icon-svg" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="error-icon-blur"></div>
    </div>

    <h1 class="error-title">Oups !</h1>
    
    <div class="error-content">
      <p class="error-message">
        {{ errorMessage() }}
      </p>
      
      <div class="error-details">
        <div class="error-details-content">
          <svg class="error-details-icon" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <div>
            <p class="error-details-title">Problème détecté</p>
            <p class="error-details-text">
              {{ errorDetails() }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="actions-container">
      <app-button
        [type]="'button'"
        [variant]="'primary'"
        [size]="'lg'"
        (click)="goToLogin()"
        class="action-button"
        label="Retour à la connexion"
      >
        
      </app-button>
      
      <app-button
        [type]="'button'"
        [size]="'lg'"
        (click)="goToRegister()"
        class="action-button"
        label=" Créer un nouveau compte"
      >
       
      </app-button>
      
      @if (showResendButton()) {
        <app-button
          [type]="'button'"
          [variant]="'secondary'"
          
          [size]="'lg'"
          [loading]="isLoading()"
          [disabled]="isLoading()"
          (click)="resendVerification()"
          class="resend-button"
          label="Renvoyer le lien de vérification"
        >
          <svg class="resend-icon" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
          </svg>
          Renvoyer le lien de vérification
        </app-button>
      }
    </div>
  </div>
</div>

<div class="contact-card">
  <div class="contact-header">
    <div class="title-group">
      <div class="icon-circle">
        <i class="bi bi-send"></i>
      </div>
      <div>
        <h3>Contacter le club</h3>
        <p class="subtitle">{{ clubName() }}</p>
      </div>
    </div>
    <button class="close-btn" (click)="close.emit()" [disabled]="isSending()">
      <i class="bi bi-x"></i>
    </button>
  </div>

  @if (isSuccess()) {
    <div class="success-view">
      <div class="success-icon-wrapper">
        <div class="success-ring"></div>
        <i class="bi bi-check-circle"></i>
      </div>
      <h4>Message Envoyé !</h4>
      <p>Votre demande a été transmise à l'administration du club.</p>
    </div>
  } @else {
    <form (submit)="$event.preventDefault(); onSubmit()" class="contact-form">
      <div class="form-group">
        <label for="subject">Sujet</label>
        <div class="input-wrapper">
          <i class="bi bi-card-text"></i>
          <input type="text" id="subject" [ngModel]="subject()" (ngModelChange)="subject.set($event)"
                 name="subject" placeholder="L'objet de votre message" required [disabled]="isSending()">
        </div>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <div class="input-wrapper textarea-wrapper">
          <i class="bi bi-envelope-open"></i>
          <textarea id="message" [ngModel]="message()" (ngModelChange)="message.set($event)" name="message"
                    placeholder="Comment pouvons-nous vous aider ?" required rows="5"
                    [disabled]="isSending()"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="close.emit()" [disabled]="isSending()">
          Annuler
        </button>
        <button type="submit" class="btn-submit" [disabled]="isSending() || !subject().trim() || !message().trim()">
        <span *ngIf="!isSending()">
          Envoyer le message <i class="bi bi-arrow-right"></i>
        </span>
          <span *ngIf="isSending()">
          Envoi en cours... <i class="bi bi-arrow-clockwise spin"></i>
        </span>
        </button>
      </div>
    </form>
  }
</div>

<div class="modal-backdrop fade show"></div>
<div class="modal fade show d-block" tabindex="-1" role="dialog" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow-lg border-0">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" *ngIf="!showCashInfo">Mode de Paiement</h5>
                <h5 class="modal-title fw-bold" *ngIf="showCashInfo">Paiement en Espèces</h5>
                <button type="button" class="btn-close" (click)="closeModal()"></button>
            </div>
            <div class="modal-body p-4 text-center">

                <div *ngIf="!showCashInfo">
                    <p class="text-muted mb-4">Comment souhaitez-vous régler votre inscription ?</p>
                    <div class="d-grid gap-3">
                        <button (click)="selectPaymentMethod('online')"
                            class="btn btn-outline-primary btn-lg rounded-3 p-3 d-flex align-items-center justify-content-center gap-3 transition-hover text-start">
                            <i class="bi bi-credit-card-2-back fs-1 text-primary"></i>
                            <div class="flex-grow-1 ps-3">
                                <div class="fw-bold fs-5">Paiement en ligne</div>
                                <small class="text-muted">Carte Bancaire / Stripe</small>
                            </div>
                            <i class="bi bi-chevron-right text-muted"></i>
                        </button>

                        <button (click)="selectPaymentMethod('cash')"
                            class="btn btn-outline-dark btn-lg rounded-3 p-3 d-flex align-items-center justify-content-center gap-3 transition-hover text-start">
                            <i class="bi bi-cash-coin fs-1 text-success"></i>
                            <div class="flex-grow-1 ps-3">
                                <div class="fw-bold fs-5">Paiement en espèces</div>
                                <small class="text-muted">Payer sur place</small>
                            </div>
                            <i class="bi bi-chevron-right text-muted"></i>
                        </button>
                    </div>
                </div>

                <app-cash-payment-info *ngIf="showCashInfo" (close)="closeModal()"></app-cash-payment-info>

            </div>
        </div>
    </div>
</div>

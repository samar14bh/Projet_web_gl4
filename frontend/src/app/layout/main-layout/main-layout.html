<div class="layout-container" [class.sidebar-open]="isSidebarOpen()">
  <div class="sidebar-overlay" [class.active]="isSidebarOpen()" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="isSidebarOpen()">
    <app-sidebar />
  </aside>

  <main class="main-content">
    <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>
    <button class="hamburger-btn" (click)="toggleSidebar()" type="button" aria-label="Toggle menu">
      <i class="bi" [class.bi-list]="!isSidebarOpen()" [class.bi-x]="isSidebarOpen()"></i>
    </button>

    <router-outlet />
  </main>
</div>

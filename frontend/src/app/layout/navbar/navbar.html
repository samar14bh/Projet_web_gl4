<header class="topbar">
  <div class="topbar-left">
    <button class="btn-icon menu-toggle">
      <i class="bi bi-list"></i>
    </button>

    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search projects, files, people..." class="search-input">
    </div>
  </div>

  <div class="topbar-right">
    <div class="quick-actions">
      <button class="btn-icon" title="Command Menu">
        <i class="bi bi-command"></i>
      </button>
    </div>

    <!-- Notifications Dropdown -->
    <div class="dropdown-wrapper">
      <button class="btn-icon" (click)="toggleNotifications()" title="Notifications">
        <i class="bi bi-bell"></i>
        <span *ngIf="unreadCount > 0" class="notification-badge">{{ unreadCount }}</span>
      </button>

      <div class="dropdown-menu" [class.show]="showNotifications">
        <div class="dropdown-header">
          <h6>Notifications</h6>
          <button class="btn-text" (click)="markAllAsRead()">Mark all read</button>
        </div>

        <div class="notifications-list">
          <div *ngFor="let notification of notifications"
               class="notification-item"
               [class.unread]="!notification.read"
               (click)="markAsRead(notification)">
            <div class="notification-icon" [ngClass]="'type-' + notification.type">
              <i class="bi" [ngClass]="notification.icon"></i>
            </div>
            <div class="notification-content">
              <h6>{{ notification.title }}</h6>
              <p>{{ notification.message }}</p>
              <span class="time">{{ notification.time }}</span>
            </div>
          </div>
        </div>

        <div class="dropdown-footer">
          <a href="#" class="view-all">View All Notifications →</a>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown -->
    <div class="dropdown-wrapper">
      <button class="user-profile" (click)="toggleUserMenu()">
        <img src="https://ui-avatars.com/api/?name=Sarah+Chen&background=667eea&color=fff&bold=true"
             alt="User"
             class="user-avatar">
        <div class="user-info">
          <span class="user-name">Sarah Chen</span>
          <span class="user-role">Product Designer</span>
        </div>
        <i class="bi bi-chevron-down"></i>
      </button>

      <div class="dropdown-menu user-menu" [class.show]="showUserMenu">
        <div class="user-menu-header">
          <img src="https://ui-avatars.com/api/?name=Sarah+Chen&background=667eea&color=fff&bold=true"
               alt="User"
               class="user-avatar-large">
          <h6>Sarah Chen</h6>
          <p>sarah.chen@company.com</p>
        </div>

        <div class="user-menu-items">
          <a href="#" class="menu-item">
            <i class="bi bi-person-circle"></i>
            <span>My Profile</span>
          </a>
          <a href="#" class="menu-item">
            <i class="bi bi-gear"></i>
            <span>Account Settings</span>
          </a>
          <a href="#" class="menu-item">
            <i class="bi bi-palette"></i>
            <span>Appearance</span>
          </a>
          <a href="#" class="menu-item">
            <i class="bi bi-shield-check"></i>
            <span>Privacy & Security</span>
          </a>

          <div class="menu-divider"></div>

          <a href="#" class="menu-item">
            <i class="bi bi-question-circle"></i>
            <span>Help & Support</span>
          </a>
          <a href="#" class="menu-item">
            <i class="bi bi-keyboard"></i>
            <span>Keyboard Shortcuts</span>
          </a>

          <div class="menu-divider"></div>

          <a href="#" class="menu-item text-danger">
            <i class="bi bi-box-arrow-right"></i>
            <span>Sign Out</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

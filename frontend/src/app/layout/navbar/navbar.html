<header class="topbar">
  <div class="topbar-left">
    <button class="btn-icon menu-toggle">
      <i class="bi bi-list"></i>
    </button>


  </div>

  <div class="topbar-right">


    @if (user()) {
    <!-- Notifications Dropdown -->
    <div class="dropdown-wrapper">
      <button class="btn-icon" (click)="toggleNotifications()" title="Notifications">
        <i class="bi bi-bell"></i>
        <span *ngIf="unreadCount() > 0" class="notification-badge">{{ unreadCount() }}</span>
      </button>

      <div class="dropdown-menu" [class.show]="showNotifications()">
        <div class="dropdown-header">
          <h6>Notifications</h6>
          <button class="btn-text" (click)="markAllAsRead()">Mark all read</button>
        </div>

        <div class="notifications-list">
          <div *ngFor="let notification of notifications" class="notification-item" [class.unread]="!notification.read"
            (click)="markAsRead(notification)">
            <div class="notification-icon" [ngClass]="'type-' + notification.type">
              <i class="bi" [ngClass]="notification.icon"></i>
            </div>
            <div class="notification-content">
              <h6>{{ notification.title }}</h6>
              <p>{{ notification.message }}</p>
              <span class="time">{{ notification.time }}</span>
            </div>
          </div>
        </div>

        <div class="dropdown-footer">
          <a href="#" class="view-all">View All Notifications →</a>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown -->
    <div class="dropdown-wrapper">
      <button class="user-profile" (click)="toggleUserMenu()">
        <img [src]="user()?.image | defaultImage:'user'" alt="User" class="user-avatar">
         <div class="user-info">
           <span *ngIf="admin()" class="admin-label">Admin</span>
           <span *ngIf="!admin()">{{ user()?.name || 'Guest' }}</span>
          </div>
        <i class="bi bi-chevron-down"></i>
      </button>

      <div class="dropdown-menu user-menu" [class.show]="showUserMenu()">
        <div class="user-menu-header">
          <img [src]="user()?.image | defaultImage : 'user'" alt="User" class="user-avatar-large">
          <h6>{{ user()?.name }}</h6>
          <p>{{ user()?.email }}</p>
        </div>

        <div class="user-menu-items">
          <a routerLink="/profile" class="menu-item">
            <i class="bi bi-person-circle"></i>
            <span>My Profile</span>
          </a>
          <a routerLink="/settings" class="menu-item">
            <i class="bi bi-gear"></i>
            <span>Account Settings</span>
          </a>

          <div class="menu-divider"></div>
          <button type="button" class="menu-item text-danger" (click)="onLogout()">
          <i class="bi bi-box-arrow-right"></i>
           <span>Sign Out</span>
          </button>
        </div>
      </div>
    </div>
    } @else {
    <div class="header-actions">
      <button class="login-btn" routerLink="/login" >
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Se connecter</span>
      </button>

    </div>
    }
  </div>
</header>

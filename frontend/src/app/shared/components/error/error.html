<div class="alert alert-danger shadow-sm rounded-4 border-0 d-flex flex-column" role="alert">
  <div class="d-flex align-items-center mb-2">
    <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
    <div>
      <h5 class="alert-heading mb-1">Oups !</h5>
      <p class="mb-0">{{errorMessage()}}</p>
    </div>
  </div>
  <div class="mt-3">
    <ng-container *ngIf="returnLink(); else historyBack">
      <a [routerLink]="returnLink()" class="btn btn-danger rounded-pill px-4">
        <i class="bi bi-arrow-left me-2"></i> Retour
      </a>
    </ng-container>
    <ng-template #historyBack>
      <button (click)="goBack()" class="btn btn-danger rounded-pill px-4">
        <i class="bi bi-arrow-left me-2"></i> Retour
      </button>
    </ng-template>
  </div>
</div>

<div
  appLazyLoading
  (visible)="onVisible()"
  style="height: 1px; margin-top: -1px;"
></div>

<footer class="clubhub-footer">
  <div class="footer-content">

    <!-- Brand -->
    <div class="footer-column brand-column">
      <h2 class="site-name">ClubHub</h2>

      <p class="mission-statement">
        Connectez, collaborez et grandissez au sein de notre communauté étudiante.
        Découvrez des clubs passionnants et développez vos compétences avec des pairs partageant vos intérêts.
      </p>

      <div class="social-icons">
        <a href="https://twitter.com" target="_blank" aria-label="Twitter" class="social-icon">
          <i class="bi bi-twitter"></i>
        </a>
        <a href="https://instagram.com" target="_blank" aria-label="Instagram" class="social-icon">
          <i class="bi bi-instagram"></i>
        </a>
        <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn" class="social-icon">
          <i class="bi bi-linkedin"></i>
        </a>
        <a href="https://facebook.com" target="_blank" aria-label="Facebook" class="social-icon">
          <i class="bi bi-facebook"></i>
        </a>
      </div>
    </div>

    <!-- Navigation -->
    <div class="footer-column">
      <h4 class="column-title">Navigation</h4>
      <ul>
        <li><button type="button" (click)="scrollToTop()">Accueil</button></li>
        <li><button type="button" (click)="scrollToTop()">Explorer les clubs</button></li>
        <li><button type="button" (click)="scrollToTop()">À propos</button></li>
        <li><button type="button" (click)="scrollToTop()">Contact</button></li>
      </ul>
    </div>

    <!-- Légal -->
    <div class="footer-column">
      <h4 class="column-title">Légal</h4>
      <ul>
        <li><button type="button">Politique de confidentialité</button></li>
        <li><button type="button">Conditions d'utilisation</button></li>
      </ul>
    </div>

  </div>

  <div class="footer-divider"></div>

  <div class="copyright-bar">
    <div class="copyright-content">
      <p>
        © 2025 ClubHub — Tous droits réservés
      </p>

      
    </div>
  </div>
</footer>

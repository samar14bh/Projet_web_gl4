<div class="section-card">
    <div class="section-header">
        <div class="section-header-icon">
            <i class="bi bi-clock-history"></i>
        </div>
        <h3>Demandes Récentes</h3>
    </div>
    <div class="section-body">
        @if (members().length === 0) {
        <div class="empty-state">
            <span class="empty-state-icon">
                <i class="bi bi-check-circle"></i>
            </span>
            <p>Aucune demande à valider</p>
        </div>
        } @else {
        <div class="item-list">
            @for (member of displayedMembers(); track member.id) {
            <div class="list-item">
                <div class="item-avatar member">
                    @if (member.image) {
                    <img [src]="member.image" [alt]="member.name + ' ' + member.lastName" />
                    } @else {
                    <i class="bi bi-person-plus-fill"></i>
                    }
                </div>
                <div class="item-content">
                    <h4 class="item-title">{{ member.name }} {{ member.lastName }}</h4>
                    <p class="item-meta">{{ member.email }}</p>
                </div>
                @if (canManage()) {
                <div class="item-actions">
                    <button class="btn-action btn-icon-success" (click)="onApprove(member.id)" title="Approuver">
                        <i class="bi bi-check-lg"></i>
                    </button>
                    <button class="btn-action btn-icon-danger" (click)="onReject(member.id)" title="Rejeter">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                }
            </div>
            }
        </div>
        }
        <button (click)="onViewAll()" class="view-all-btn">
            <span>Toutes les demandes</span>
            <i class="bi bi-arrow-right"></i>
        </button>
    </div>
</div>

<div class="section-card">
    <div class="section-header">
        <div class="section-header-icon">
            <i class="bi bi-lightning-fill"></i>
        </div>
        <h3>Accès Rapides</h3>
    </div>
    <div class="section-body">
        <div class="action-grid">
            @if (canCreateEvent()) {
            <button (click)="onCreateEvent()" class="action-card" title="Créer un nouvel événement">
                <div class="action-icon-large">
                    <i class="bi bi-calendar-plus-fill"></i>
                </div>
                <span>Nouvel Événement</span>
            </button>
            }
            <button (click)="onManageMembers()" class="action-card" title="Gérer les adhésions">
                <div class="action-icon-large">
                    <i class="bi bi-people-fill"></i>
                </div>
                <span>Membres</span>
            </button>
            @if (canManageClub()) {
            <button (click)="onManageClub()" class="action-card" title="Paramètres du club">
                <div class="action-icon-large">
                    <i class="bi bi-gear-fill"></i>
                </div>
                <span>Paramètres</span>
            </button>
            }
            @if (canViewFinances()) {
            <button (click)="onViewFinances()" class="action-card" title="Tableau de bord financier">
                <div class="action-icon-large">
                    <i class="bi bi-bar-chart-fill"></i>
                </div>
                <span>Finances</span>
            </button>
            }
        </div>
    </div>
</div>
